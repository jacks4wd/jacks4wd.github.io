<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>Historial del vehículo · JACKS4WD</title>
<link rel="icon" href="img/icono.png">
<style>
  :root { --bg:#f3f4f6; --card:#fff; --text:#1f2937; --muted:#6b7280; --line:#e5e7eb; --primary:#c2410c; --ok:#15803d; --ok-bg:#dcfce7; --warn:#a16207; --warn-bg:#fef9c3; --bad:#b91c1c; --bad-bg:#fee2e2; --blue:#2563eb; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif; }
  .wrap { max-width: 720px; margin: 0 auto; padding: 16px; }
  header { background: radial-gradient(120% 140% at 100% 0%, #262626 0%, #111 45%, #000 100%); color:#fff; border-radius:16px; padding:20px; border-bottom:4px solid var(--primary); box-shadow:0 6px 18px rgba(0,0,0,.25); }
  .top { display:flex; justify-content:space-between; align-items:center; gap:12px; }
  .top img { height:40px; filter:brightness(0) invert(1); }
  .hola { font-size:.95rem; opacity:.85; margin-top:14px; }
  .veh { font-size:1.6rem; font-weight:800; letter-spacing:-.01em; line-height:1.15; }
  .placa { display:inline-block; margin-top:8px; background:#fff; color:#111; font-weight:800; letter-spacing:2px; border-radius:6px; padding:2px 10px; }
  /* Selector de vehículos (flotas) */
  .selector { display:flex; width:100%; align-items:center; justify-content:space-between; gap:12px; background:transparent; border:0; color:#fff; font:inherit; text-align:left; padding:0; cursor:pointer; }
  .selector .veh { display:block; }
  .selector .flecha { flex:none; width:36px; height:36px; border-radius:50%; background:rgba(255,255,255,.12); border:1px solid rgba(255,255,255,.25); display:flex; align-items:center; justify-content:center; font-size:1.1rem; transition:transform .2s; }
  .selector.abierto .flecha { transform:rotate(180deg); background:var(--primary); border-color:var(--primary); }
  .menu-flota { margin-top:14px; background:rgba(255,255,255,.06); border:1px solid rgba(255,255,255,.15); border-radius:12px; overflow:hidden; }
  .menu-flota .menu-tit { font-size:.8rem; opacity:.7; padding:8px 12px; }
  .menu-flota .op { display:flex; width:100%; justify-content:space-between; gap:10px; background:transparent; border:0; border-top:1px solid rgba(255,255,255,.1); color:#fff; font:inherit; padding:10px 12px; cursor:pointer; text-align:left; }
  .menu-flota .op b { letter-spacing:1px; }
  .menu-flota .op.on { background:rgba(194,65,12,.35); }
  .menu-flota .op:hover { background:rgba(255,255,255,.1); }
  .card { background:var(--card); border:1px solid var(--line); border-radius:16px; padding:16px 18px; margin-top:14px; }
  .card h2 { margin:0 0 6px; font-size:1.05rem; }
  .prox { display:flex; gap:14px; align-items:center; }
  .prox .ic { width:46px; height:46px; border-radius:12px; background:var(--warn-bg); display:flex; align-items:center; justify-content:center; font-size:1.4rem; flex:none; }
  .prox .envase { width:64px; height:80px; object-fit:contain; flex:none; background:#fff; border-radius:12px; border:1px solid var(--line); padding:4px; }
  .ev .cuerpo { display:flex; gap:12px; align-items:flex-start; } .ev .cuerpo > div { flex:1; min-width:0; }
  .ev .mini { width:44px; height:56px; object-fit:contain; flex:none; background:#fff; border:1px solid var(--line); border-radius:8px; padding:2px; }
  .prox b { font-size:1.15rem; }
  .muted { color:var(--muted); font-size:.9rem; }
  .filtros { display:flex; gap:8px; margin-top:16px; flex-wrap:wrap; }
  .filtros button { border:1px solid var(--line); background:#fff; border-radius:999px; padding:6px 14px; font:inherit; font-size:.9rem; cursor:pointer; color:var(--text); }
  .filtros button.on { background:var(--text); color:#fff; border-color:var(--text); }
  .linea { position:relative; margin-top:8px; padding-left:22px; }
  .linea::before { content:""; position:absolute; left:7px; top:6px; bottom:6px; width:2px; background:var(--line); }
  .ev { position:relative; background:var(--card); border:1px solid var(--line); border-radius:14px; padding:12px 14px; margin-top:12px; }
  .ev::before { content:""; position:absolute; left:-20px; top:18px; width:12px; height:12px; border-radius:50%; background:var(--muted); border:2px solid var(--bg); }
  .ev.aceite::before { background:var(--primary); } .ev.rep::before { background:var(--blue); } .ev.rev::before { background:var(--ok); }
  /* Elementos compactos que se abren al tocarlos */
  .ev { padding:0; }
  .ev .cab { display:flex; width:100%; justify-content:space-between; gap:10px; align-items:center; background:transparent; border:0; font:inherit; color:inherit; text-align:left; padding:12px 14px; cursor:pointer; }
  .ev .cab-txt { display:flex; flex-direction:column; min-width:0; }
  .ev .cab-der { display:flex; align-items:center; gap:8px; flex:none; }
  .ev .resumen { color:var(--muted); font-size:.85rem; }
  .ev .chev { color:var(--muted); transition:transform .2s; }
  .ev.abierto .chev { transform:rotate(180deg); }
  .ev .det { padding:0 14px 14px; border-top:1px solid var(--line); padding-top:10px; }
  .ev .tipo { font-weight:700; }
  .ev .fecha { color:var(--muted); font-size:.85rem; }
  /* Detalle de revisiones */
  .rv-conteo { display:flex; gap:6px; flex-wrap:wrap; margin:8px 0; }
  .tag.urg { background:var(--bad-bg); color:var(--bad); } .tag.reg { background:var(--warn-bg); color:var(--warn); }
  .rv-grupo { margin-top:10px; }
  .rv-gt { font-weight:700; font-size:.9rem; padding:4px 10px; border-radius:8px; }
  .rv-gt.urg { background:var(--bad-bg); color:var(--bad); } .rv-gt.reg { background:var(--warn-bg); color:var(--warn); } .rv-gt.ok { background:var(--ok-bg); color:var(--ok); }
  .rv-obs { margin-top:10px; font-size:.95rem; }
  .btn.pdf { margin-top:12px; cursor:pointer; }
  /* Hoja imprimible (PDF de la revisión) */
  #imprimir { display:none; }
  @media print {
    @page { size: letter; margin: 12mm; }
    body { background:#fff; }
    #app { display:none !important; }
    #imprimir { display:block; color:#000; font:12px/1.4 Arial, sans-serif; }
    #imprimir * { -webkit-print-color-adjust:exact; print-color-adjust:exact; }
    .pdf-cab { display:flex; justify-content:space-between; align-items:center; border-bottom:2px solid #000; padding-bottom:8px; }
    .pdf-cab img { height:42px; } .pdf-cab div { text-align:right; font-size:11px; }
    #imprimir h1 { font-size:16px; text-align:center; margin:12px 0; letter-spacing:1px; }
    .pdf-datos { width:100%; border:1px solid #000; border-collapse:collapse; margin-bottom:10px; }
    .pdf-datos td { padding:5px 8px; border:1px solid #000; }
    .pdf-conteo { display:flex; gap:10px; margin:8px 0 12px; }
    .pdf-conteo span, .est { padding:2px 8px; border-radius:10px; font-weight:600; }
    .pdf-conteo .urg, .est.urg { background:#fee2e2; color:#b91c1c; } .pdf-conteo .reg, .est.reg { background:#fef9c3; color:#a16207; } .pdf-conteo .ok, .est.ok { background:#dcfce7; color:#15803d; }
    .pdf-puntos { width:100%; border-collapse:collapse; }
    .pdf-puntos th, .pdf-puntos td { border:1px solid #999; padding:5px 7px; text-align:left; vertical-align:top; }
    .pdf-puntos th { background:#eee; } .pdf-puntos tr.sec td { background:#222; color:#fff; font-weight:700; }
    .pdf-puntos tr { page-break-inside:avoid; }
    .pdf-obs { margin-top:12px; }
  }
  .ev ul { margin:6px 0 0; padding-left:18px; } .ev li { margin:2px 0; }
  .tag { display:inline-block; border-radius:999px; padding:1px 9px; font-size:.78rem; font-weight:600; }
  .tag.ok { background:var(--ok-bg); color:var(--ok); } .tag.proc { background:var(--warn-bg); color:var(--warn); }
  .acciones { display:flex; gap:10px; flex-wrap:wrap; margin-top:16px; }
  .btn { display:inline-flex; align-items:center; gap:6px; border-radius:10px; padding:10px 14px; font:inherit; font-weight:600; text-decoration:none; border:1px solid var(--line); background:#fff; color:var(--text); }
  .btn.wa { background:#16a34a; border-color:#16a34a; color:#fff; }
  .estado { text-align:center; padding:50px 16px; color:var(--muted); }
  footer { text-align:center; color:var(--muted); font-size:.85rem; padding:22px 0 30px; }
</style>
</head>
<body>
<div class="wrap" id="app"><div class="estado">Cargando historial…</div></div>
<div id="imprimir"></div>

<script src="nube-config.js?v=1af767f1bf"></script>
<script src="aceites-fotos.js?v=0db4da2da7"></script>
<script>
(() => {
  const TALLER = { nombre: 'JACKS4WD', wa: '584142333535', direccion: 'C.C.C.T. Sótano 1', telefono: '0414-2333535' };
  const MESES_ACEITE = 3;
  const app = document.getElementById('app');
  const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const FECHA = /^\d{4}-\d{2}-\d{2}$/;
  const fecha = (iso) => { if (!FECHA.test(iso || '')) return ''; const [y, m, d] = iso.split('-').map(Number); return new Date(y, m - 1, d).toLocaleDateString('es-VE', { day: 'numeric', month: 'long', year: 'numeric' }); };
  const km = (n) => (Number.isFinite(Number(n)) && n !== null && n !== '' ? Number(n).toLocaleString('es-VE') + ' km' : '');
  const num = (n) => '#' + String(Number(n) || 0).padStart(4, '0');
  // Foto del envase: la propia del catálogo (imagen incrustada) o la predeterminada de img/aceites
  const FOTO = /^data:image\/(png|jpeg|webp|gif);base64,[A-Za-z0-9+/=]+$/;
  const fotoAceite = (s) => (typeof s.aceiteFoto === 'string' && FOTO.test(s.aceiteFoto) ? s.aceiteFoto
    : (typeof fotoPredeterminadaAceite === 'function' ? fotoPredeterminadaAceite(s.aceiteMarca, s.aceiteLinea, s.aceiteViscosidad) : ''));
  const sumarMeses = (iso, m) => { const [y, mo, d] = iso.split('-').map(Number); const f = new Date(y, mo - 1 + m, d); return `${f.getFullYear()}-${String(f.getMonth() + 1).padStart(2, '0')}-${String(f.getDate()).padStart(2, '0')}`; };
  const mensaje = (t) => { app.innerHTML = `<header><div class="top"><strong>${TALLER.nombre}</strong><img src="img/logo.png" alt=""></div></header><div class="card estado">${t}</div>${pie()}`; };
  const pie = () => `<div class="acciones"><a class="btn wa" href="https://wa.me/${TALLER.wa}" target="_blank" rel="noopener">Escribir al taller por WhatsApp</a><a class="btn" href="garantias.html">Póliza de garantías</a></div>
    <footer><strong>${TALLER.nombre}</strong> · ${TALLER.direccion} · Telf: ${TALLER.telefono}</footer>`;

  const token = (location.hash.slice(1) || new URLSearchParams(location.search).get('t') || '').trim();
  const cfg = typeof NUBE_CONFIG !== 'undefined' ? NUBE_CONFIG : null;
  if (!/^[A-Za-z0-9]{24,64}$/.test(token)) return mensaje('Este enlace no es válido. Pide al taller tu enlace personal.');
  if (!cfg || !cfg.url || !cfg.clave) return mensaje('El historial no está disponible en este momento.');

  fetch(`${cfg.url}/rest/v1/rpc/historial_vehiculo`, {
    method: 'POST', headers: { apikey: cfg.clave, 'Content-Type': 'application/json' }, body: JSON.stringify({ p_token: token }),
  }).then((r) => (r.ok ? r.json() : Promise.reject(new Error(r.status))))
    .then((d) => (d && d.vehiculo ? pintar(d) : mensaje('Este enlace ya no está activo. Pide al taller tu enlace personal actualizado.')))
    .catch(() => mensaje('No se pudo cargar el historial. Revisa tu conexión e intenta de nuevo.'));

  // ---------- Revisiones: puntos evaluados (misma lógica que la app, con la estructura guardada en cada revisión) ----------
  const ESTADOS = {
    reemplazo: { n: 'Reemplazo inmediato', titulo: 'Reemplazo inmediato', cls: 'urg' },
    regular: { n: 'Estado regular', titulo: 'Estado regular (revisar pronto)', cls: 'reg' },
    bueno: { n: 'Buen estado', titulo: 'En buen estado', cls: 'ok' },
  };
  const VIDA = { reemplazo: '-20%', regular: '45%', bueno: '+50%' };
  const obj = (x) => (x && typeof x === 'object' && !Array.isArray(x) ? x : {});
  const lista = (x) => (Array.isArray(x) ? x : []);
  function defDe(item, e) {
    const d = { k: item.k, n: item.n };
    if (item.tipo === 'vida') d.vida = true;
    if (item.tipo === 'medida') d.medida = item.medida || 'Valor medido';
    if (item.tipo === 'traseras') d.traseras = { k: item.kTras || item.k + '_tras', n: item.nTras || item.n + ' (traseras)' };
    if (item.tipo === 'fugas') { d.fugas = true; d.fluidos = lista(item.sub).map((s) => [s.k, s.n]); }
    if (item.tipo === 'fluidos') d.selector = lista(item.sub).map((s) => ({ k: s.k, n: s.n, fluido: true }));
    if (item.tipo === 'botones') { const j = lista(e.botones).find((x) => x && x.id === item.juego); if (j && lista(j.op).length) d.opciones = j.op; }
    return d;
  }
  function puntosRev(x) {
    const e = obj(x.estructura); const op = obj(x.opciones); const tras = obj(op.traseras); const flu = lista(op.fluidos);
    const secs = [...lista(e.basica), ...(x.tipo === 'completa' ? lista(e.completa) : [])];
    const out = [];
    secs.forEach((s) => lista(obj(s).items).forEach((it) => {
      const d = defDe(obj(it), e);
      if (d.selector) { d.selector.forEach((sub) => { if (flu.includes(sub.k)) out.push({ ...sub, seccion: s.t }); }); return; }
      out.push({ ...d, seccion: s.t });
      if (d.traseras && tras[d.k]) out.push({ ...d.traseras, seccion: s.t });
    }));
    return out;
  }
  function grupoDe(p, it) {
    if (!it) return '';
    if (p.fugas) { if (['si', 'reemplazo', 'regular'].includes(it.e)) return 'reemplazo'; if (['no', 'bueno'].includes(it.e)) return 'bueno'; return ''; }
    if (p.fluido) { if (!it.nivel && !it.estadoF) return ''; if (it.estadoF === 'reemplazar') return 'reemplazo'; if (it.nivel === 'falta') return 'regular'; return 'bueno'; }
    return it.e || '';
  }
  function textoFluido(it) {
    const t = [it.nivel ? (it.nivel === 'falta' ? 'falta nivel' : 'nivel óptimo') : '', it.estadoF ? (it.estadoF === 'reemplazar' ? 'requiere reemplazo' : 'estado óptimo') : ''].filter(Boolean).join(', ');
    return t.charAt(0).toUpperCase() + t.slice(1);
  }
  function etiquetaPunto(p, it) {
    const g = grupoDe(p, it);
    if (p.opciones && it.op) return it.op;
    if (p.fugas) return g === 'reemplazo' ? 'Fuga detectada' : 'Sin fugas';
    if (p.fluido) return textoFluido(it);
    if (p.vida && VIDA[g]) return `${ESTADOS[g].n} (vida útil ${VIDA[g]})`;
    return ESTADOS[g]?.n || '';
  }
  function detallePunto(p, it) {
    const partes = [];
    if (it.medida) partes.push(it.medida + (/\d$/.test(it.medida) && /psi/i.test(p.medida || '') ? ' psi' : ''));
    if (p.fugas && grupoDe(p, it) === 'reemplazo') {
      const f = obj(it.fugas);
      const t = lista(p.fluidos).filter(([k]) => k in f).map(([k, n]) => (f[k] ? `${n} (${f[k]})` : n)).join(', ');
      if (t) partes.push(t);
    }
    if (it.nota) partes.push(it.nota);
    return partes.join(' · ');
  }
  // Puntos evaluados (sin los N/A), con su grupo
  function evaluados(x) {
    const items = obj(x.items);
    return puntosRev(x).map((p) => ({ p, it: obj(items[p.k]) })).map((o) => ({ ...o, g: grupoDe(o.p, o.it) })).filter((o) => ESTADOS[o.g]);
  }
  function conteoRev(x) { const c = { reemplazo: 0, regular: 0, bueno: 0 }; evaluados(x).forEach((o) => c[o.g]++); return c; }
  function detalleRevHTML(x, i) {
    const ev = evaluados(x); const c = conteoRev(x);
    if (!ev.length) return `<div class="muted">${km(x.km) ? `Kilometraje: ${km(x.km)}` : 'Sin puntos registrados.'}</div>`;
    return `
      ${km(x.km) || x.tecnico ? `<div class="muted">${[km(x.km) ? `Kilometraje: ${km(x.km)}` : '', x.tecnico ? `Técnico: ${esc(x.tecnico)}` : ''].filter(Boolean).join(' · ')}</div>` : ''}
      <div class="rv-conteo">${Object.keys(ESTADOS).map((g) => `<span class="tag ${ESTADOS[g].cls}">${ESTADOS[g].n}: ${c[g]}</span>`).join('')}</div>
      ${Object.keys(ESTADOS).filter((g) => c[g]).map((g) => `
        <div class="rv-grupo"><div class="rv-gt ${ESTADOS[g].cls}">${ESTADOS[g].titulo}</div>
          <ul>${ev.filter((o) => o.g === g).map((o) => { const det = detallePunto(o.p, o.it); const et = etiquetaPunto(o.p, o.it);
            return `<li><b>${esc(o.p.n)}</b>${et && et !== ESTADOS[g].n ? ` — ${esc(et)}` : ''}${det ? `<br><span class="muted">${esc(det)}</span>` : ''}</li>`; }).join('')}</ul>
        </div>`).join('')}
      ${x.observaciones ? `<div class="rv-obs"><b>Observaciones:</b> ${esc(x.observaciones)}</div>` : ''}
      <button type="button" class="btn pdf" data-pdf="${i}">⬇ Descargar PDF</button>`;
  }
  // PDF: se arma una hoja imprimible y se abre la ventana de impresión (Guardar como PDF)
  function imprimirRevision(x, v, cliente) {
    if (!x) return;
    const ev = evaluados(x); const c = conteoRev(x);
    const secciones = [...new Set(ev.map((o) => o.p.seccion))];
    const hoja = document.getElementById('imprimir');
    hoja.innerHTML = `
      <div class="pdf-cab"><img src="img/logo.png" alt=""><div><b>${TALLER.nombre}</b><br>${TALLER.direccion}<br>Telf: ${TALLER.telefono}</div></div>
      <h1>${x.tipo === 'completa' ? 'REVISIÓN COMPLETA' : 'REVISIÓN BÁSICA'} ${num(x.numero)}</h1>
      <table class="pdf-datos">
        <tr><td>Cliente: <b>${esc(cliente || '')}</b></td><td>Fecha: <b>${fecha(x.fecha)}</b></td></tr>
        <tr><td>Vehículo: <b>${esc(v.marca)} ${esc(v.modelo)}${v.anio ? ' ' + esc(v.anio) : ''} · ${esc(v.placa || '')}</b></td><td>${km(x.km) ? `Kilometraje: <b>${km(x.km)}</b>` : ''}</td></tr>
        ${x.tecnico ? `<tr><td colspan="2">Técnico: <b>${esc(x.tecnico)}</b></td></tr>` : ''}
      </table>
      <div class="pdf-conteo">${Object.keys(ESTADOS).map((g) => `<span class="${ESTADOS[g].cls}">${ESTADOS[g].n}: <b>${c[g]}</b></span>`).join('')}</div>
      <table class="pdf-puntos">
        <tr><th>Punto revisado</th><th>Estado</th><th>Detalle</th></tr>
        ${secciones.map((s) => `<tr class="sec"><td colspan="3">${esc(s)}</td></tr>` + ev.filter((o) => o.p.seccion === s).map((o) =>
          `<tr><td>${esc(o.p.n)}</td><td><span class="est ${ESTADOS[o.g].cls}">${esc(etiquetaPunto(o.p, o.it))}</span></td><td>${esc(detallePunto(o.p, o.it))}</td></tr>`).join('')).join('')}
      </table>
      ${x.observaciones ? `<p class="pdf-obs"><b>Observaciones:</b> ${esc(x.observaciones)}</p>` : ''}`;
    const titulo = document.title;
    document.title = `Revision ${num(x.numero).slice(1)} - ${v.placa || ''}`;
    const fin = () => { document.title = titulo; window.removeEventListener('afterprint', fin); };
    window.addEventListener('afterprint', fin);
    const img = hoja.querySelector('img');
    const imprimir = () => setTimeout(() => window.print(), 80);
    if (img && !img.complete) img.onload = img.onerror = imprimir; else imprimir();
  }

  // Flota: todos los vehículos del mismo cliente (el del enlace viene primero)
  let datos = null; let flota = []; let actual = 0;
  function pintar(d, idx = 0) {
    if (d !== datos) {
      datos = d;
      flota = (Array.isArray(d.flota) ? d.flota : []).filter((x) => x && typeof x === 'object' && x.vehiculo);
      if (!flota.length) flota = [d];
    }
    actual = Math.min(Math.max(0, idx), flota.length - 1);
    const vd = flota[actual];
    const v = vd.vehiculo || {};
    const varios = flota.length > 1;
    const serv = Array.isArray(vd.servicios) ? vd.servicios : [];
    const reps = Array.isArray(vd.reparaciones) ? vd.reparaciones : [];
    const revs = Array.isArray(vd.revisiones) ? vd.revisiones : [];
    const ult = serv.find((s) => FECHA.test(s.fecha || ''));
    // Cada elemento: título, fecha y un resumen de una línea; el detalle se abre al tocarlo
    const eventos = [
      ...serv.map((s) => ({ f: s.fecha, cls: 'aceite', grupo: 'aceite',
        titulo: 'Cambio de aceite', resumen: km(s.km),
        det: `<div class="cuerpo">${fotoAceite(s) ? `<img class="mini" src="${esc(fotoAceite(s))}" alt="">` : ''}<div>
          <div>${km(s.km) ? `Kilometraje: <b>${km(s.km)}</b>` : ''}${km(s.proximoKm) ? ` · Próximo: <b>${km(s.proximoKm)}</b>` : ''}</div>
          ${s.aceite ? `<div class="muted">Aceite: ${esc(s.aceite)}</div>` : ''}
          ${s.filtro ? `<div class="muted">Filtro: ${esc(s.filtro)}</div>` : ''}
          ${s.revisiones ? `<div class="muted">Revisado: ${esc(s.revisiones)}</div>` : ''}
        </div></div>` })),
      ...reps.map((r) => ({ f: r.fechaCierre || r.fecha, cls: 'rep', grupo: 'rep',
        titulo: `${r.tipo === 'modificacion' ? 'Modificación' : 'Reparación'} ${num(r.numero)}`,
        resumen: `${r.estado === 'culminado' ? 'Entregado' : 'En proceso'}${(r.items || []).length ? ` · ${r.items.length} trabajo(s)` : ''}`,
        det: `<div>${r.estado === 'culminado' ? '<span class="tag ok">Entregado</span>' : '<span class="tag proc">En proceso</span>'}${r.notaEntrega ? ` <span class="muted">· Nota de entrega ${esc(r.notaEntrega)}</span>` : ''}</div>
          ${(r.items || []).length ? `<ul>${r.items.map((i) => `<li>${esc(i)}</li>`).join('')}</ul>` : ''}` })),
      ...revs.map((x, i) => { const c = conteoRev(x); return { f: x.fecha, cls: 'rev', grupo: 'rev',
        titulo: `${x.tipo === 'completa' ? 'Revisión completa' : 'Revisión básica'} ${num(x.numero)}`,
        resumen: [km(x.km), c.reemplazo ? `${c.reemplazo} para reemplazo` : '', c.regular ? `${c.regular} regular(es)` : ''].filter(Boolean).join(' · '),
        det: detalleRevHTML(x, i) }; }),
    ].filter((e) => FECHA.test(e.f || '')).sort((a, b) => b.f.localeCompare(a.f));

    app.innerHTML = `
      <header>
        <div class="top"><strong>${TALLER.nombre}</strong><img src="img/logo.png" alt=""></div>
        <div class="hola">${d.cliente ? `Hola, ${esc(d.cliente)}. Este es el historial de ${varios ? 'tus vehículos' : 'tu vehículo'}` : 'Historial del vehículo'}</div>
        ${varios ? `<button type="button" class="selector" id="sel-veh" aria-expanded="false" aria-haspopup="listbox">
          <span><span class="veh">${esc(v.marca)} ${esc(v.modelo)}${v.anio ? ' ' + esc(v.anio) : ''}</span>
          ${v.placa ? `<span class="placa">${esc(v.placa)}</span>` : ''}</span>
          <span class="flecha" aria-hidden="true"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"></polyline></svg></span>
        </button>
        <div class="menu-flota" id="menu-flota" role="listbox" hidden>
          <div class="menu-tit">${flota.length} vehículos registrados a tu nombre</div>
          ${flota.map((x, i) => { const w = x.vehiculo || {}; return `<button type="button" role="option" class="op ${i === actual ? 'on' : ''}" data-veh="${i}" aria-selected="${i === actual}">
            <span>${esc(w.marca)} ${esc(w.modelo)}${w.anio ? ' ' + esc(w.anio) : ''}</span><b>${esc(w.placa || '')}</b></button>`; }).join('')}
        </div>` : `<div class="veh">${esc(v.marca)} ${esc(v.modelo)}${v.anio ? ' ' + esc(v.anio) : ''}</div>
        ${v.placa ? `<span class="placa">${esc(v.placa)}</span>` : ''}`}
      </header>
      ${ult ? `<div class="card"><div class="prox">${fotoAceite(ult) ? `<img class="envase" src="${esc(fotoAceite(ult))}" alt="Aceite usado">` : '<div class="ic">🛢️</div>'}<div>
        <div class="muted">Próximo cambio de aceite</div>
        <b>${km(ult.proximoKm) || 'Según kilometraje'}</b> <span class="muted">o el ${fecha(sumarMeses(ult.fecha, MESES_ACEITE))}, lo que ocurra primero</span>
      </div></div></div>` : ''}
      <div class="filtros">
        <button class="on" data-f="">Todo (${eventos.length})</button>
        <button data-f="aceite">Aceite (${serv.length})</button>
        <button data-f="rep">Reparaciones (${reps.length})</button>
        <button data-f="rev">Revisiones (${revs.length})</button>
      </div>
      <div class="linea" id="linea">${eventos.map((e) => `<div class="ev ${e.cls}" data-g="${e.grupo}">
          <button type="button" class="cab" aria-expanded="false">
            <span class="cab-txt"><span class="tipo">${esc(e.titulo)}</span><span class="resumen">${fecha(e.f)}${e.resumen ? ' · ' + esc(e.resumen) : ''}</span></span>
            <span class="cab-der"><svg class="chev" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"></polyline></svg></span>
          </button>
          <div class="det" hidden>${e.det}</div>
        </div>`).join('') || '<div class="card estado">Aún no hay servicios registrados.</div>'}</div>
      ${pie()}`;
    if (varios) {
      const btn = document.getElementById('sel-veh'); const menu = document.getElementById('menu-flota');
      btn.onclick = () => { menu.hidden = !menu.hidden; btn.setAttribute('aria-expanded', String(!menu.hidden)); btn.classList.toggle('abierto', !menu.hidden); };
      menu.onclick = (e) => { const o = e.target.closest('[data-veh]'); if (!o) return; pintar(datos, Number(o.dataset.veh)); window.scrollTo({ top: 0, behavior: 'smooth' }); };
    }
    // Abrir / cerrar cada elemento y descargar el PDF de una revisión
    document.getElementById('linea').onclick = (e) => {
      const pdf = e.target.closest('[data-pdf]');
      if (pdf) { imprimirRevision(revs[Number(pdf.dataset.pdf)], v, d.cliente); return; }
      const cab = e.target.closest('.cab'); if (!cab) return;
      const ev = cab.closest('.ev'); const det = ev.querySelector('.det');
      det.hidden = !det.hidden; ev.classList.toggle('abierto', !det.hidden); cab.setAttribute('aria-expanded', String(!det.hidden));
    };
    app.querySelector('.filtros').onclick = (e) => {
      const b = e.target.closest('[data-f]'); if (!b) return;
      app.querySelectorAll('.filtros button').forEach((x) => x.classList.toggle('on', x === b));
      app.querySelectorAll('.ev').forEach((x) => (x.hidden = !!b.dataset.f && x.dataset.g !== b.dataset.f));
    };
  }
  window.addEventListener('hashchange', () => location.reload());
})();
</script>
</body>
</html>
