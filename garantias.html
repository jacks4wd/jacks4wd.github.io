<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Póliza de garantías · JACKS4WD</title>
<meta name="description" content="Póliza de garantías de JACKS4WD: tiempos de garantía por marca, condiciones y exclusiones.">
<link rel="icon" href="img/icono.png">
<style>
  :root { --bg:#f3f4f6; --card:#fff; --text:#1f2937; --muted:#6b7280; --line:#e5e7eb; --primary:#c2410c; --ok:#15803d; --ok-bg:#dcfce7; --bad:#b91c1c; --bad-bg:#fee2e2; --warn-bg:#fef9c3; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font:16px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif; }
  .wrap { max-width: 860px; margin: 0 auto; padding: 16px; }
  header { background: radial-gradient(120% 140% at 100% 0%, #262626 0%, #111 45%, #000 100%); border-bottom:4px solid var(--primary); box-shadow:0 6px 18px rgba(0,0,0,.25); color:#fff; border-radius:14px; padding:22px; display:flex; gap:16px; align-items:center; justify-content:space-between; flex-wrap:wrap; }
  header img { height:52px; filter:brightness(0) invert(1); }
  header h1 { margin:0; font-size:1.6rem; letter-spacing:-.01em; }
  header p { margin:4px 0 0; opacity:.85; }
  section { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:18px 20px; margin-top:16px; }
  h2 { margin:0 0 10px; font-size:1.15rem; display:flex; gap:10px; align-items:center; }
  h2 .n { background:var(--primary); color:#fff; width:28px; height:28px; border-radius:50%; display:inline-flex; align-items:center; justify-content:center; font-size:.9rem; flex:none; }
  .nota { margin:0 0 6px; }
  table { width:100%; border-collapse:collapse; }
  th, td { text-align:left; padding:10px 8px; border-top:1px solid var(--line); vertical-align:middle; }
  th { color:var(--muted); font-weight:600; font-size:.85rem; border-top:0; }
  td.t { width:1%; white-space:nowrap; }
  td.l { width:64px; padding-right:4px; }
  .logo { width:56px; height:36px; object-fit:contain; display:block; }
  .ini { width:40px; height:36px; border-radius:8px; background:var(--bg); color:var(--muted); font-weight:800; font-size:.8rem; display:flex; align-items:center; justify-content:center; letter-spacing:.5px; }
  .tag { display:inline-block; border-radius:999px; padding:3px 12px; font-size:.85rem; font-weight:700; background:var(--ok-bg); color:var(--ok); white-space:nowrap; }
  .cond td:first-child { font-weight:700; width:30%; vertical-align:top; }
  .cond td { vertical-align:top; }
  ul { margin:6px 0 0; padding-left:20px; } li { margin:4px 0; }
  .alerta { background:var(--bad-bg); border-color:#fecaca; } .alerta h2 .n { background:var(--bad); }
  .info { background:var(--warn-bg); border-color:#fde68a; }
  footer { text-align:center; color:var(--muted); font-size:.9rem; padding:18px 0 30px; }
  .btn { display:inline-block; margin-top:8px; background:#fff; color:var(--text); border:1px solid var(--line); border-radius:10px; padding:8px 14px; font:inherit; cursor:pointer; }
  @media (max-width: 560px) { .cond td:first-child { width:38%; } td.l { width:52px; } .logo { width:46px; } }
  @media print { body { background:#fff; } section, header { break-inside:avoid; } .noprint { display:none; } header, .tag, .ini { -webkit-print-color-adjust:exact; print-color-adjust:exact; } }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div><h1>Póliza de garantías</h1><p>JACKS4WD · Especialistas en vehículos 4x4</p></div>
    <img src="img/logo.png" alt="JACKS4WD">
  </header>
  <div id="poliza"></div>
  <footer>
    <strong>JACKS4WD</strong> · C.C.C.T. Sótano 1 · Telf: 0414-2333535 · R.I.F: J-506760762
    <div class="noprint"><button class="btn" onclick="window.print()">Imprimir / guardar PDF</button></div>
  </footer>
</div>
<script src="nube-config.js?v=187b2feecc"></script>
<script src="garantias-datos.js?v=a258058eab"></script>
<script>
(() => {
  const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const iniciales = (n) => String(n || '').replace(/\(.*?\)/g, '').trim().split(/\s+/).map((p) => p[0]).join('').slice(0, 3).toUpperCase();
  const tablaTiempos = (filas, etiqueta) => `<table>
      <tr><th></th><th>${etiqueta}</th><th>Garantía</th></tr>
      ${filas.map((f) => `<tr>
        <td class="l">${f.logo ? `<img class="logo" src="${esc(f.logo)}" alt="">` : `<div class="ini">${esc(iniciales(f.nombre))}</div>`}</td>
        <td>${esc(f.nombre)}</td>
        <td class="t">${f.tiempo ? `<span class="tag">${esc(f.tiempo)}</span>` : ''}</td></tr>`).join('')}
    </table>`;

  function pintar(p) {
    let n = 0;
    const sec = (titulo, cuerpo, cls = '', marca = null) => `<section class="${cls}"><h2><span class="n">${marca ?? ++n}</span>${esc(titulo)}</h2>${cuerpo}</section>`;
    const partes = [];
    if (p.marcas.filas.length) partes.push(sec(p.marcas.titulo, `${p.intro ? `<p class="nota">${esc(p.intro)}</p>` : ''}${p.marcas.nota ? `<p class="nota">${esc(p.marcas.nota)}</p>` : ''}${tablaTiempos(p.marcas.filas, 'Marca')}`));
    if (p.electricas.filas.length) partes.push(sec(p.electricas.titulo, `${p.electricas.nota ? `<p class="nota">${esc(p.electricas.nota)}</p>` : ''}${tablaTiempos(p.electricas.filas, 'Pieza')}`));
    if (p.manoObra.texto) partes.push(sec(p.manoObra.titulo, `<p style="margin:0">${esc(p.manoObra.texto)}</p>`));
    if (p.condiciones.filas.length) partes.push(sec(p.condiciones.titulo, `${p.condiciones.nota ? `<p class="nota">${esc(p.condiciones.nota)}</p>` : ''}
      <table class="cond"><tr><th>Tipo de pieza</th><th>Condición</th></tr>${p.condiciones.filas.map((f) => `<tr><td>${esc(f.nombre)}</td><td>${esc(f.texto)}</td></tr>`).join('')}</table>`));
    if (p.exclusiones.items.length) partes.push(sec(p.exclusiones.titulo, `<ul>${p.exclusiones.items.map((x) => `<li>${esc(x)}</li>`).join('')}</ul>`, 'alerta', '!'));
    if (p.validar.items.length) partes.push(sec(p.validar.titulo, `<ul>${p.validar.items.map((x) => `<li>${esc(x)}</li>`).join('')}</ul>`, 'info', 'i'));
    document.getElementById('poliza').innerHTML = partes.join('');
  }

  // Se muestra la póliza original al instante y luego la guardada en la configuración (si existe)
  pintar(limpiarPoliza(POLIZA_INICIAL));
  const cfg = typeof NUBE_CONFIG !== 'undefined' ? NUBE_CONFIG : null;
  if (cfg && cfg.url && cfg.clave) {
    fetch(`${cfg.url}/rest/v1/rpc/poliza_garantias`, { method: 'POST', headers: { apikey: cfg.clave, 'Content-Type': 'application/json' }, body: '{}' })
      .then((r) => (r.ok ? r.json() : null))
      .then((d) => { if (d && typeof d === 'object') pintar(limpiarPoliza(d)); })
      .catch(() => {});
  }
})();
</script>
</body>
</html>
